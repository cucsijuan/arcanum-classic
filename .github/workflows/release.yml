name: Release

# Pushing a tag like v0.1.0 publishes a release with the module zip, ready for Extras → "Install module from zip…".
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the version
        run: |
          version=$(jq -r .version manifest.json)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "manifest.json says $version but the tag is $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Build the zip
        run: git archive --format=zip --prefix=arcanum-classic/ -o "arcanum-classic-$GITHUB_REF_NAME.zip" HEAD

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "arcanum-classic-$GITHUB_REF_NAME.zip" \
            --title "Classic $GITHUB_REF_NAME" \
            --notes "Install: download arcanum-classic-$GITHUB_REF_NAME.zip, then in Arcanum open Extras → Install module from zip… and choose it. The first start after installing downloads the card data (a few minutes)."
